let questionsActives = [];
let indexQuestion = 0;
let score = 0;
let categorieActuelle = "tous";
let repondu = false;


/* ==================== CHOIX CATEGORIE ==================== */

function choisirCategorie(categorie,bouton){

  categorieActuelle = categorie;

  document.querySelectorAll(".categories button").forEach(btn=>{
    btn.classList.remove("active");
  });

  bouton.classList.add("active");

  demarrerQuiz();
}


/* ==================== DEMARRER ==================== */

function demarrerQuiz(){

  if(categorieActuelle === "tous"){
    questionsActives = [...questions];
  }else{
    questionsActives = questions.filter(
      q => q.categorie === categorieActuelle
    );
  }

  indexQuestion = 0;
  score = 0;
  repondu = false;

  document.getElementById("quiz").style.display = "block";
  document.getElementById("resultat").style.display = "none";

  afficherQuestion();
}


/* ==================== AFFICHER QUESTION ==================== */

function afficherQuestion(){

  if(indexQuestion >= questionsActives.length){
    afficherResultat();
    return;
  }

  repondu = false;

  const q = questionsActives[indexQuestion];

  document.getElementById("compteur").textContent =
    "Question " + (indexQuestion + 1) +
    " / " + questionsActives.length;

  document.getElementById("question").textContent =
    q.question;

  const conteneur =
    document.getElementById("reponses");

  conteneur.innerHTML = "";

  q.reponses.forEach((reponse,i)=>{

    const bouton =
      document.createElement("button");

    bouton.textContent = reponse;

    bouton.onclick = function(){
      verifierReponse(i,bouton);
    };

    conteneur.appendChild(bouton);
  });

  document.getElementById("explication").style.display =
    "none";

  document.getElementById("explication").innerHTML = "";

  document.getElementById("suivant").style.display =
    "none";

  const pourcentage =
    (indexQuestion / questionsActives.length) * 100;

  document.getElementById("progress").style.width =
    pourcentage + "%";
}


/* ==================== VERIFIER ==================== */

function verifierReponse(index,boutonClique){

  if(repondu) return;

  repondu = true;

  const q = questionsActives[indexQuestion];

  const boutons =
    document.querySelectorAll("#reponses button");

  boutons.forEach(btn=>{
    btn.disabled = true;
  });

  if(index === q.bonne){

    boutonClique.classList.add("bonne");

    score++;

  }else{

    boutonClique.classList.add("mauvaise");

    boutons[q.bonne].classList.add("bonne");
  }

  const explication =
    document.getElementById("explication");

  explication.innerHTML =
    "<strong>💡 Explication :</strong><br>" +
    q.explication;

  explication.style.display = "block";

  document.getElementById("suivant").style.display =
    "block";
}


/* ==================== QUESTION SUIVANTE ==================== */

function questionSuivante(){

  indexQuestion++;

  afficherQuestion();
}


/* ==================== RESULTAT ==================== */

function afficherResultat(){

  document.getElementById("quiz").style.display =
    "none";

  document.getElementById("resultat").style.display =
    "block";

  document.getElementById("progress").style.width =
    "100%";

  document.getElementById("scoreFinal").textContent =
    score + " / " + questionsActives.length;

  let message = "";

  const pourcentage =
    (score / questionsActives.length) * 100;

  if(pourcentage >= 80){

    message =
      "🌟 Excellent ! Tes connaissances vétérinaires sont très bonnes.";

  }else if(pourcentage >= 60){

    message =
      "👏 Très bien ! Continue à approfondir tes connaissances.";

  }else if(pourcentage >= 40){

    message =
      "📚 Bon début ! Continue à apprendre et à t'entraîner.";

  }else{

    message =
      "💪 Continue tes révisions, tu progresseras avec la pratique.";
  }

  document.getElementById("messageFinal").textContent =
    message;
}


/* ==================== RECOMMENCER ==================== */

function recommencerQuiz(){

  demarrerQuiz();
}


/* ==================== LANCEMENT ==================== */

demarrerQuiz();
